version: "2"

formatters:
  enable:
    - gofumpt

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - revive
    - gocritic
    - bodyclose
    - nilerr
    - prealloc
  settings:
    revive:
      rules:
        - name: blank-imports
        - name: exported
        - name: unreachable-code
        - name: unused-parameter
    gocritic:
      enabled-tags:
        - diagnostic
        - style

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
